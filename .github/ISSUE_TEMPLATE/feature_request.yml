name: Feature Request
description: Suggest a new feature or enhancement for APIKeyPER
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe your idea clearly and include the user problem it solves.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem, limitation, or workflow gap does this address?
      placeholder: "I find it difficult to ... / There is currently no way to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to add or change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other ideas you considered and why they are insufficient.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any examples, links, or context that would help shape the request.
